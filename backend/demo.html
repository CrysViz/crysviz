<!DOCTYPE html>
<html>
<body>

<h2>Optional Backend Demo</h2>
<button onclick="connectBackend()">Connect Backend</button>
<button onclick="disconnectBackend()">Disconnect</button>
<p id="backendStatus">Backend: not connected</p>

<hr>

<input type="number" id="numInput" placeholder="Enter number">
<button onclick="calculate()">Calculate Square</button>

<p id="calcStatus"></p>
<p id="calcResult"></p>


<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<script>
let socket = null;
let backendConnected = false;

function connectBackend() {
    if (backendConnected) return;

    socket = io("http://localhost:5001", {
        timeout: 1000,
        reconnection: false
    });

    socket.on("connect", () => {
        backendConnected = true;
        document.getElementById("backendStatus").textContent =
            "Backend: connected";
    });

    socket.on("connect_error", () => {
        backendConnected = false;
        document.getElementById("backendStatus").textContent =
            "Backend: not found (running without backend)";
    });

    socket.on("status", (data) => {
        document.getElementById("calcStatus").textContent = data.message;
    });

    socket.on("result", (data) => {
        document.getElementById("calcStatus").textContent = "Done!";
        document.getElementById("calcResult").textContent =
            "Result: " + data.result;
    });
}

function disconnectBackend() {
    if (!backendConnected || !socket) return;

    socket.disconnect();
    backendConnected = false;

    document.getElementById("backendStatus").textContent =
        "Backend: disconnected";

    document.getElementById("calcStatus").textContent = "";
    document.getElementById("calcResult").textContent = "";
}

function calculate() {
    const num = Number(document.getElementById("numInput").value);

    if (!backendConnected) {
        document.getElementById("calcStatus").textContent =
            "Backend not connected!";
        return;
    }

    document.getElementById("calcStatus").textContent =
        "Request sent to backend...";
    document.getElementById("calcResult").textContent = "";

    socket.emit("calculate_square", { number: num });
}
</script>
