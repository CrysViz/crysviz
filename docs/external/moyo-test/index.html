<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Moyo WASM Test</title>
</head>
<body>
  <h1>Moyo WASM Test</h1>
  <pre id="output"></pre>

  <script type="module">
    import init, { analyze_cell } from './moyo_wasm.js';

    async function run() {
      // Important: use the correct WASM file path
      await init('./moyo_wasm_bg.wasm');

      const cell = {
        lattice: { basis: [2, 0, 0, 0, 1, 0, 0, 0, 1] },
        positions: [[0, 0, 0]],
        numbers: [14]
      };

      const result = analyze_cell(JSON.stringify(cell), 1e-4, 'Standard');

      console.log(result);

      document.getElementById("output").textContent =
        JSON.stringify(result, null, 2);
    }

    run();
  </script>
</body>
</html>
