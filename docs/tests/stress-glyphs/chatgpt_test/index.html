<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Stress Tensor Superquadric Glyph</title>
<style>
  body {
    margin: 0;
    background: #111;
    color: white;
    font-family: sans-serif;
    display: flex;
    height: 100vh;
  }
  .sidebar {
    width: 280px;
    padding: 12px;
    background: #181818;
    box-sizing: border-box;
  }
  textarea {
    width: 100%;
    height: 120px;
    background: #222;
    color: #eee;
    border: 1px solid #333;
    font-family: monospace;
    font-size: 14px;
    padding: 6px;
  }
  .hint {
    font-size: 12px;
    opacity: 0.7;
    margin-top: 6px;
  }
  canvas {
    display: block;
  }
</style>
</head>

<body>

<div class="sidebar">
  <div><b>3×3 Stress Tensor</b></div>
  <textarea id="matrix">
3 1 0
1 2 0
0 0 1
  </textarea>
  <div class="hint">
    Rows separated by newline<br>
    Values separated by spaces
  </div>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
