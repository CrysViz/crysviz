<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superquadric Tensor Glyphs (Schultz et al. 2010)</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
        #ui {
            position: absolute; top: 10px; left: 10px; background: rgba(255,255,255,0.8);
            padding: 10px; border-radius: 5px; z-index: 100;
        }
        input, button { margin: 5px; padding: 5px; }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="ui">
        <h3>Tensor Input</h3>
        <div>
            <label>xx: <input type="number" id="xx" value="1.0" step="0.1"></label>
            <label>xy: <input type="number" id="xy" value="0.0" step="0.1"></label>
            <label>xz: <input type="number" id="xz" value="0.0" step="0.1"></label>
        </div>
        <div>
            <label>yy: <input type="number" id="yy" value="1.0" step="0.1"></label>
            <label>yz: <input type="number" id="yz" value="0.0" step="0.1"></label>
        </div>
        <div>
            <label>zz: <input type="number" id="zz" value="1.0" step="0.1"></label>
        </div>
        <button id="update">Update Tensor</button>
        <button id="hydrostatic">Hydrostatic (Sphere)</button>
        <button id="cylinder">Cylinder</button>
        <button id="disk">Disk</button>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script>
        // =============================================
        // Eigen Decomposition (Jacobi for 3x3 symmetric)
        // =============================================
        function eigenDecomposition(tensor) {
            const mat = [
                [tensor[0], tensor[1], tensor[2]],
                [tensor[1], tensor[3], tensor[4]],
                [tensor[2], tensor[4], tensor[5]]
            ];
            const n = 3;
            let V = [];
            for (let i = 0; i < n; i++) {
                V[i] = [];
                for (let j = 0; j < n; j++) V[i][j] = 0;
                V[i][i] = 1;
            }
            const maxIterations = 100;
            const threshold = 1e-10;
            let iteration = 0;
            let changed;
            do {
                changed = false;
                for (let p = 0; p < n; p++) {
                    for (let q = p + 1; q < n; q++) {
                        const a = mat[p][p], b = mat[q][q], c = mat[p][q];
                        const delta = (b - a) / 2;
                        const sign = delta >= 0 ? 1 : -1;
                        const z = sign * c;
                        const r = Math.hypot(z, Math.abs(delta));
                        const c1 = Math.sqrt((1 + Math.abs(delta)/r) / 2);
                        const s1 = sign * Math.sqrt((1 - Math.abs(delta)/r) / 2);
                        if (Math.abs(c) > threshold) {
                            changed = true;
                            const newA = a*c1*c1 + b*s1*s1 - 2*c*c1*s1;
                            const newB = a*s1*s1 + b*c1*c1 + 2*c*c1*s1;
                            const newC = (a - b)*c1*s1 + c*(c1*c1 - s1*s1);
                            mat[p][p] = newA; mat[q][q] = newB; mat[p][q] = mat[q][p] = newC;
                            for (let i = 0; i < n; i++) {
                                if (i !== p && i !== q) {
                                    const temp = mat[p][i];
                                    mat[p][i] = mat[i][p] = c1*temp - s1*mat[q][i];
                                    mat[q][i] = mat[i][q] = s1*temp + c1*mat[q][i];
                                }
                            }
                            for (let i = 0; i < n; i++) {
                                const temp = V[i][p];
                                V[i][p] = c1*temp - s1*V[i][q];
                                V[i][q] = s1*temp + c1*V[i][q];
                            }
                        }
                    }
                }
                iteration++;
            } while (changed && iteration < maxIterations);
            return {
                evals: [mat[0][0], mat[1][1], mat[2][2]],
                evecs: [V[0], V[1], V[2]]
            };
        }

        // =============================================
        // Schultz et al. (2010) Superquadric Functions
        // =============================================
        const AIR_ABS = Math.abs;
        const AIR_MAX = Math.max;
        function AIR_AFFINE(a, b, c, d, e, x) { return d + (e - d) * ((x - a) / (c - a)); }

        function tenGlyphBqdUvEval(uv, evals) {
            const ax = AIR_ABS(evals[0]), ay = AIR_ABS(evals[1]), az = AIR_ABS(evals[2]);
            const mm = AIR_MAX(ax, AIR_MAX(ay, az));
            if (mm === 0) { uv[0] = uv[1] = 0; return; }
            const xx = evals[0]/mm, yy = evals[1]/mm, zz = evals[2]/mm;
            uv[0] = AIR_AFFINE(-1, yy, 1, 0, 1, yy);
            uv[1] = (xx > -zz) ?
                AIR_AFFINE(-1, zz, 1, 0, 1, zz) - uv[0] + 1 :
                AIR_AFFINE(-1, xx, 1, -1, 0, xx) - uv[0] + 1;
        }

        function tenGlyphBqdZoneUv(uv) {
            const u = uv[0], v = uv[1], upv = u + v, tupv = 2*u + v;
            if (u > 0.5) {
                if (upv > 1.5) return u < v ? 0 : 1;
                if (tupv > 2) return 2;
                if (upv > 1) return 3;
                return 4;
            } else {
                if (upv > 0.5) {
                    if (upv > 1) return 5;
                    if (tupv > 1) return 6;
                    return 7;
                } else return u < v ? 8 : 9;
            }
        }

        function tenGlyphBqdAbcUv(abc, uv, betaMax) {
            const vertsZone = [
                [0,1,2], [0,2,3], [1,3,4], [1,4,5], [4,5,9],
                [1,5,6], [5,6,9], [6,7,9], [7,8,10], [8,9,10]
            ];
            const uvVert = [
                [1.00,1.00], [0.50,1.00], [0.75,0.75], [1.00,0.50], [1.00,0.00],
                [0.50,0.50], [0.00,1.00], [0.00,0.50], [0.25,0.25], [0.50,0.00],
                [0.00,0.00]
            ];
            const abcBall = [1,1,1], abcCyli = [1,0,0], abcFunk = [0,betaMax,2];
            const abcThrn = [1,betaMax,3], abcOcta = [0,2,2], abcCone = [1,2,2];
            const abcHalf = [0.5,0.5,0.5];
            const abcAll = Array(10).fill().map(() => Array(11).fill(null));
            abcAll[0][0]=abcBall; abcAll[0][1]=abcCyli; abcAll[0][2]=abcHalf;
            abcAll[1][0]=abcBall; abcAll[1][2]=abcHalf; abcAll[1][3]=abcCyli;
            abcAll[2][1]=abcOcta; abcAll[2][3]=abcCone; abcAll[2][4]=abcThrn;
            abcAll[3][1]=abcOcta; abcAll[3][4]=abcThrn; abcAll[3][5]=abcFunk;
            abcAll[4][4]=abcThrn; abcAll[4][5]=abcFunk; abcAll[4][9]=abcCone;
            abcAll[5][1]=abcCone; abcAll[5][5]=abcFunk; abcAll[5][6]=abcThrn;
            abcAll[6][5]=abcFunk; abcAll[6][6]=abcThrn; abcAll[6][9]=abcOcta;
            abcAll[7][6]=abcThrn; abcAll[7][7]=abcCone; abcAll[7][9]=abcOcta;
            abcAll[8][7]=abcCyli; abcAll[8][8]=abcHalf; abcAll[8][10]=abcBall;
            abcAll[9][8]=abcHalf; abcAll[9][9]=abcCyli; abcAll[9][10]=abcBall;
            const zone = tenGlyphBqdZoneUv(uv);
            const pvi = vertsZone[zone];
            const bcoord = [0,0,0];
            baryFind(bcoord, uv, uvVert[pvi[0]], uvVert[pvi[1]], uvVert[pvi[2]]);
            baryBlend(abc, bcoord, abcAll[zone][pvi[0]], abcAll[zone][pvi[1]], abcAll[zone][pvi[2]]);
        }

        function baryFind(bcoord, uvp, uv0, uv1, uv2) {
            const mat = [];
            ELL_3M_SET(mat, uv0[0],uv0[1],1, uv1[0],uv1[1],1, uvp[0],uvp[1],1);
            const a01 = AIR_ABS(ELL_3M_DET(mat));
            ELL_3M_SET(mat, uv0[0],uv0[1],1, uv2[0],uv2[1],1, uvp[0],uvp[1],1);
            const a02 = AIR_ABS(ELL_3M_DET(mat));
            ELL_3M_SET(mat, uv1[0],uv1[1],1, uv2[0],uv2[1],1, uvp[0],uvp[1],1);
            const a12 = AIR_ABS(ELL_3M_DET(mat));
            const a = a01 + a02 + a12;
            ELL_3V_SET(bcoord, a12/a, a02/a, a01/a);
        }

        function baryBlend(abc, co, abc0, abc1, abc2) {
            for (let ii=0; ii<3; ii++)
                abc[ii] = co[0]*abc0[ii] + co[1]*abc1[ii] + co[2]*abc2[ii];
        }

        function ELL_3M_SET(mat, r0c0,r0c1,r0c2, r1c0,r1c1,r1c2, r2c0,r2c1,r2c2) {
            mat[0]=r0c0; mat[1]=r0c1; mat[2]=r0c2;
            mat[3]=r1c0; mat[4]=r1c1; mat[5]=r1c2;
            mat[6]=r2c0; mat[7]=r2c1; mat[8]=r2c2;
        }

        function ELL_3M_DET(mat) {
            return mat[0]*(mat[4]*mat[8]-mat[5]*mat[7]) -
                   mat[1]*(mat[3]*mat[8]-mat[5]*mat[6]) +
                   mat[2]*(mat[3]*mat[7]-mat[4]*mat[6]);
        }

        function ELL_3V_SET(arr, x, y, z) { arr[0]=x; arr[1]=y; arr[2]=z; }

        // =============================================
        // Superquadric Geometry (Schultz et al. 2010)
        // =============================================
        function createSuperquadric(alpha, beta, gamma, resolution=32) {
            const vertices = [], indices = [];
            for (let i=0; i<=resolution; i++) {
                const theta = (i/resolution)*Math.PI*2;
                for (let j=0; j<=resolution; j++) {
                    const phi = (j/resolution)*Math.PI;
                    const x = Math.sign(Math.cos(theta))*Math.pow(Math.abs(Math.cos(theta)), alpha) *
                              Math.sign(Math.cos(phi))*Math.pow(Math.abs(Math.cos(phi)), gamma);
                    const y = Math.sign(Math.sin(phi))*Math.pow(Math.abs(Math.sin(phi)), beta);
                    const z = Math.sign(Math.sin(theta))*Math.pow(Math.abs(Math.sin(theta)), alpha) *
                              Math.sign(Math.cos(phi))*Math.pow(Math.abs(Math.cos(phi)), gamma);
                    vertices.push(x, y, z);
                }
            }
            for (let i=0; i<resolution; i++) {
                for (let j=0; j<resolution; j++) {
                    const a = i*(resolution+1) + j;
                    const b = i*(resolution+1) + j + 1;
                    const c = (i+1)*(resolution+1) + j;
                    const d = (i+1)*(resolution+1) + j + 1;
                    indices.push(a, b, d);
                    indices.push(a, d, c);
                }
            }
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geometry.setIndex(indices);
            geometry.computeVertexNormals();
            return geometry;
        }

        // =============================================
        // Tensor Glyph Creation (Schultz et al. 2010)
        // =============================================
        function createTensorGlyph(tensor) {
            const {evals, evecs} = eigenDecomposition(tensor);
            const uv = [0,0];
            tenGlyphBqdUvEval(uv, evals);
            const abc = [0,0,0];
            tenGlyphBqdAbcUv(abc, uv, 3.0);
            const geometry = createSuperquadric(abc[0], abc[1], abc[2]);
            const matrix = new THREE.Matrix4();
            const scale = new THREE.Vector3(...evals.map(e => Math.max(Math.abs(e), 0.01)));
            const rotation = new THREE.Matrix4().set(
                evecs[0][0], evecs[1][0], evecs[2][0], 0,
                evecs[0][1], evecs[1][1], evecs[2][1], 0,
                evecs[0][2], evecs[1][2], evecs[2][2], 0,
                0, 0, 0, 1
            );
            matrix.multiplyMatrices(rotation, new THREE.Matrix4().scale(scale));
            const material = new THREE.MeshStandardMaterial({
                color: 0xff5555, roughness: 0.3, metalness: 0.5
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.applyMatrix4(matrix);
            return mesh;
        }

        // =============================================
        // Three.js Setup
        // =============================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 5);

        const renderer = new THREE.WebGLRenderer({antialias: true});
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lighting
        const light1 = new THREE.DirectionalLight(0xffffff, 1);
        light1.position.set(1, 1, 1);
        scene.add(light1);
        const light2 = new THREE.DirectionalLight(0xffffff, 0.5);
        light2.position.set(-1, -1, -1);
        scene.add(light2);
        const ambient = new THREE.AmbientLight(0x404040);
        scene.add(ambient);

        // Grid and axes
        const gridHelper = new THREE.GridHelper(10, 10);
        scene.add(gridHelper);
        const axesHelper = new THREE.AxesHelper(5);
        scene.add(axesHelper);

        // UI Event Handlers
        let currentGlyph = null;
        function updateGlyph(tensor) {
            if (currentGlyph) scene.remove(currentGlyph);
            currentGlyph = createTensorGlyph(tensor);
            scene.add(currentGlyph);
        }

        document.getElementById('update').addEventListener('click', () => {
            const tensor = [
                parseFloat(document.getElementById('xx').value),
                parseFloat(document.getElementById('xy').value),
                parseFloat(document.getElementById('xz').value),
                parseFloat(document.getElementById('yy').value),
                parseFloat(document.getElementById('yz').value),
                parseFloat(document.getElementById('zz').value)
            ];
            updateGlyph(tensor);
        });

        document.getElementById('hydrostatic').addEventListener('click', () => {
            updateGlyph([1, 0, 0, 1, 0, 1]); // Hydrostatic (sphere)
        });

        document.getElementById('cylinder').addEventListener('click', () => {
            updateGlyph([1, 0, 0, 0.1, 0, 0.1]); // Cylinder
        });

        document.getElementById('disk').addEventListener('click', () => {
            updateGlyph([1, 0, 0, 1, 0, 0.1]); // Disk
        });

        // Initialize with hydrostatic tensor
        updateGlyph([1, 0, 0, 1, 0, 1]);

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            if (currentGlyph) {
                currentGlyph.rotation.x += 0.005;
                currentGlyph.rotation.y += 0.01;
            }
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
