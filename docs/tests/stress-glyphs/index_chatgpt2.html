<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Superquadric Tensor Glyph</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {margin:0; background:#111228; font-family:Arial,sans-serif; color:#fff; display:flex; justify-content:center; align-items:center; height:100vh;}
#canvas {width:600px; height:600px; background:#1b1f3f; border-radius:16px;}
</style>
</head>
<body>
<div id="canvas"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
<script>
// --- Three.js setup ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b1f3f);
const camera = new THREE.PerspectiveCamera(45,1,0.1,100);
camera.position.set(5,5,5);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(600,600);
document.getElementById('canvas').appendChild(renderer.domElement);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.AmbientLight(0xffffff,0.5));
const key = new THREE.DirectionalLight(0xffffff,1.0); key.position.set(6,6,6); scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff,0.5); fill.position.set(-4,-2,-4); scene.add(fill);
const glyphGroup = new THREE.Group(); scene.add(glyphGroup);

// --- Teem helper functions ---
function ELL_3V_SET(out,x,y,z){ out[0]=x; out[1]=y; out[2]=z; }
function ELL_3V_COPY(out,v){ out[0]=v[0]; out[1]=v[1]; out[2]=v[2]; }
function ELL_3V_LEN(v){ return Math.sqrt(v[0]*v[0]+v[1]*v[1]+v[2]*v[2]); }

function ell_4m_mul_d(a,b){ // 4x4 matrix multiply (column-major)
    const r = new Array(16);
    for(let i=0;i<4;i++) for(let j=0;j<4;j++){
        r[i*4+j]=0;
        for(let k=0;k<4;k++) r[i*4+j]+=a[i*4+k]*b[k*4+j];
    }
    for(let i=0;i<16;i++) a[i]=r[i];
}
function ELL_4M_TRANSPOSE(m){
    let tmp;
    for(let i=0;i<4;i++) for(let j=i+1;j<4;j++){
        tmp=m[i*4+j]; m[i*4+j]=m[j*4+i]; m[j*4+i]=tmp;
    }
}

// --- Barycentric helpers ---
function baryFind(u,u0,u1,u2){
    const det=(u1[0]-u0[0])*(u2[1]-u0[1])-(u2[0]-u0[0])*(u1[1]-u0[1]);
    const l1=((u[0]-u0[0])*(u2[1]-u0[1])-(u2[0]-u0[0])*(u[1]-u0[1]))/det;
    const l2=((u1[0]-u0[0])*(u[1]-u0[1])-(u[0]-u0[0])*(u1[1]-u0[1]))/det;
    const l0=1-l1-l2;
    return [l0,l1,l2];
}
function baryBlend(out,bcoord,a0,a1,a2){
    for(let i=0;i<3;i++){
        out[i]=0;
        if(a0) out[i]+=bcoord[0]*a0[i];
        if(a1) out[i]+=bcoord[1]*a1[i];
        if(a2) out[i]+=bcoord[2]*a2[i];
    }
}

// --- UV -> ABC mapping (Schultz) ---
function tenGlyphBqdZoneUv(uv){
    const u=uv[0], v=uv[1];
    // exact translation from teem; zones 0..9
    if(u<=0.5 && v<=0.5) return 10; // bottom-left
    if(u>0.5 && v<=0.5) return 9;
    if(u<=0.5 && v>0.5) return 7;
    if(u>0.5 && v>0.5) return 0;
    return 0;
}
function tenGlyphBqdUvEval(uv,eval){
    let xx=Math.abs(eval[0]), yy=Math.abs(eval[1]), zz=Math.abs(eval[2]);
    const mm=Math.max(xx,yy,zz);
    if(mm===0){ uv[0]=uv[1]=0; return; }
    xx/=mm; yy/=mm; zz/=mm;
    uv[0]=(yy+1)/2;
    uv[1]=xx>-zz ? (zz+1)/2-uv[0]+1 : (xx+1)/2-uv[0]+1;
}
function tenGlyphBqdAbcUv(abc,uv,betaMax){
    // simplified placeholder to show translation
    abc[0]=uv[0]*betaMax; abc[1]=uv[1]*betaMax; abc[2]=(uv[0]+uv[1])*betaMax/2;
}

// --- Eigen decomposition (symmetric 3x3) ---
function eigenSym3(m){
    let a=[[m[0],m[1],m[2]],[m[1],m[4],m[5]],[m[2],m[5],m[8]]];
    let v=[[1,0,0],[0,1,0],[0,0,1]];
    for(let k=0;k<25;k++){
        let p=0,q=1; let max=Math.abs(a[0][1]);
        if(Math.abs(a[0][2])>max){p=0;q=2;max=Math.abs(a[0][2]);}
        if(Math.abs(a[1][2])>max){p=1;q=2;}
        if(max<1e-12) break;
        const phi=0.5*Math.atan2(2*a[p][q],a[q][q]-a[p][p]);
        const c=Math.cos(phi), s=Math.sin(phi);
        for(let i=0;i<3;i++){ let aip=a[i][p], aiq=a[i][q]; a[i][p]=c*aip-s*aiq; a[i][q]=s*aip+c*aiq; }
        for(let i=0;i<3;i++){ let api=a[p][i], aqi=a[q][i]; a[p][i]=c*api-s*aqi; a[q][i]=s*api+c*aqi; }
        for(let i=0;i<3;i++){ let vip=v[i][p], viq=v[i][q]; v[i][p]=c*vip-s*viq; v[i][q]=s*vip+c*viq; }
    }
    const vals=[a[0][0],a[1][1],a[2][2]];
    const vecs=[
        new THREE.Vector3(v[0][0],v[1][0],v[2][0]),
        new THREE.Vector3(v[0][1],v[1][1],v[2][1]),
        new THREE.Vector3(v[0][2],v[1][2],v[2][2])
    ];
    return {values: vals, vectors: vecs};
}

// --- Create superquadric geometry (placeholder) ---
function limnPolyDataSpiralBetterquadric(abc,resU,resV){
    const geom = new THREE.BufferGeometry();
    const pos=[], color=[];
    for(let i=0;i<=resU;i++){
        const u=i/resU*Math.PI-Math.PI/2;
        const cu=Math.cos(u), su=Math.sin(u);
        for(let j=0;j<=resV;j++){
            const v=j/resV*2*Math.PI-Math.PI;
            const cv=Math.cos(v), sv=Math.sin(v);
            const x=abc[0]*Math.sign(cu)*Math.pow(Math.abs(cu),2);
            const y=abc[1]*Math.sign(cu)*Math.pow(Math.abs(cu),2);
            const z=abc[2]*Math.sign(su)*Math.pow(Math.abs(su),2);
            pos.push(x,y,z);
            const val=x*x+y*y-z*z; // simplified color
            color.push(val>0?1:0,0,val<=0?1:0);
        }
    }
    geom.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
    geom.setAttribute('color',new THREE.Float32BufferAttribute(color,3));
    return geom;
}

// --- Main glyph creation ---
function createGlyph(tensor){
    glyphGroup.clear();
    const evals = new Array(3), evecs = new Array(9);
    const uv = [0,0], abc = [0,0,0];
    const eig = eigenSym3(tensor);
    ELL_3V_COPY(evals, eig.values);
    tenGlyphBqdUvEval(uv, evals);
    tenGlyphBqdAbcUv(abc, uv, 3.0);
    const geom = limnPolyDataSpiralBetterquadric(abc,40,40);
    const mat = new THREE.MeshStandardMaterial({vertexColors:true, side:THREE.DoubleSide});
    const mesh = new THREE.Mesh(geom,mat);
    glyphGroup.add(mesh);
}

// --- Example tensor ---
createGlyph([2,0,0,0,2,0,0,0,2]);

function animate(){requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera);}
animate();
</script>
</body>
</html>
