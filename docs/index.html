<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>POSCAR Crystal Structure Viewer</title>
  <link rel="stylesheet" href="styles.css">

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <!-- Collapsible info panel styles (kept local so this change is self-contained) -->
  <style>
    #infoPanel { background:#1f262a; color:rgba(6,140,50,1); padding:12px; border-radius:10px; width:260px; box-shadow:0 8px 24px rgba(0,0,0,0.35); font-family:system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; }
    .structure-toggle { display:flex; align-items:center; justify-content:space-between; cursor:pointer; user-select:none; padding:6px 8px; border-radius:8px; background:linear-gradient(180deg,#273033,#1e272a); border:1px solid rgba(255,255,255,0.03); }
    .structure-toggle h4 { margin:0; font-size:14px; color:rgba(6,140,50,1); font-weight:600; line-height:1; }
    /* New shared heading style to align 'Structure' and 'Measure' */
    /* Use the same left inset as the toggle container so text aligns perfectly */
    .section-heading { margin-top:10px; margin-bottom:6px; font-size:14px; color:gba(6,140,50,1); font-weight:600; padding-left:8px; }
    .toggle-icon { width:30px; height:30px; display:flex; align-items:center; justify-content:center; border-radius:6px; background:rgba(255,255,255,0.03); color:rgba(6,140,50,1); font-weight:700; transition:transform .18s ease, background .18s ease, color .18s ease; }
    .toggle-icon.open { transform:rotate(45deg); background:rgba(6,140,50,1); color:#032226; }
    .collapsible-content { overflow:hidden; max-height:0; transition:max-height .28s ease, padding .18s ease; }
    .collapsible-content.open { padding-top:8px; max-height:600px; }
    #composition { color:#d7eef6; font-size:13px; line-height:1.4; }
    #measure { margin-top:8px; }
    #measureRow { display:flex; justify-content:space-between; gap:8px; color:#cfeffb; }
    .btn-mini { background:transparent; border:1px solid rgba(255,255,255,0.08); color:#cfeffb; padding:6px 10px; border-radius:6px; cursor:pointer; }
    .btn-mini:hover { background:rgba(255,255,255,0.02); }
    /* Highlighted clear button for visual clarity */
    .btn-mini.highlight { background:linear-gradient(90deg,#2aa6f2,#0077b6); border-color:rgba(0,0,0,0.15); color:#fff; box-shadow:0 6px 14px rgba(10,100,160,0.18); }
    .btn-mini.highlight:hover { filter:brightness(1.03); }
    .btn-mini:focus { outline:3px solid rgba(100,180,240,0.18); }
  </style>
</head>

<body>
  <div id="mobileMenuToggle">☰</div>
  <div id="mobileOverlay"></div>
  <div id="ui">
    <img src="./CrysViz_logo.png" alt="A description of my photo" class="logo">
    <div class="control-group">
      <h3>Load POSCAR File</h3>
      <input type="file" id="fileInput">
      <label for="fileInput" id="fileLabel">
        📁 Choose POSCAR file or drag & drop
      </label>
    </div>
    <div class="control-group">
      <h3>Load CIF File</h3>
      <input type="file" id="fileCIFInput">
      <label for="fileCIFInput" id="fileCIFLabel">
        📁 Choose CIF file or drag & drop
      </label>
    </div>


    <div class="control-group" id="structureControls" style="display: none;">
      <h3>Visualization Options</h3>
      <label>
        <input type="checkbox" id="showBonds" checked> Show Bonds
      </label>
      <label>
        <input type="checkbox" id="showLattice" checked> Show Unit Cell
      </label>
      <label>
        <input type="checkbox" id="orthographicCamera" checked> Parallel Projection
      </label>
      <label>
        <input type="checkbox" id="vestaColors" checked> VESTA Colors
      </label>
      <label>
        Atom Size: <span id="atomSizeValue" class="slider-value">0.6</span>
        <input type="range" id="atomSize" min="0.1" max="2.0" step="0.1" value="0.6">
      </label>
    </div>

    <div class="control-group" id="bondControlsGroup" style="display: none;">
      <h3>Bond Length Controls</h3>
      <button id="resetBondLengths" class="reset-btn">Reset to Defaults</button>
      <div id="bondControls"></div>
    </div>
  </div>

  <div id="view"></div>
  <div id="status">Loading crystal viewer...</div>

  <!-- Measurement Tools UI -->
  <div id="measurementTools">
    <!-- Measurement panel -->
    <div id="measurementPanel" class="measurement-group">
      <button id="distanceModeBtn" class="measure-tool-btn" title="Distance Measurement">
        <div class="tool-icon scale-icon">📏</div>
        <span>Distance</span>
      </button>
      <button id="angleModeBtn" class="measure-tool-btn" title="Angle Measurement">
        <div class="tool-icon protractor-icon">📐</div>
        <span>Angle</span>
      </button>
      <button id="clearAllMeasurements" class="measure-tool-btn clear-btn" title="Clear All Measurements">
        <div class="tool-icon">🗑️</div>
        <span>Clear</span>
      </button>
    </div>

    <!-- Mobile toggle button (shows only on mobile) -->
    <button id="measurementToggle" class="measurement-toggle" title="Toggle Measurements">📐</button>
  </div>

  <script type="module" src="crystal-viewer.js"></script>


  <div id="infoPanel">
    <div id="structureToggle" class="structure-toggle" role="button" tabindex="0" aria-expanded="false" aria-controls="composition">
      <h4>Structure</h4>
      <div id="structureToggleIcon" class="toggle-icon">+</div>
    </div>

    <div id="composition" class="collapsible-content" aria-hidden="true">
      <!-- Composition will be populated by JS. Hidden by default; expands when the header is toggled -->
    </div>
  </div>

  <script>
    (function(){
      const toggle = document.getElementById('structureToggle');
      const icon = document.getElementById('structureToggleIcon');
      const content = document.getElementById('composition');

      // Remove or hide injected controls like 'collapse', 'show more', '+1 more'
      function stripControls(root) {
        if (!root) return;
        const nodes = Array.from(root.querySelectorAll('*'));
        const moreRe = /(\+\s*\d+\s*more|^\+?\s*\d+\s*more$|\bshow more\b|\bcollapse\b)/i;
        nodes.forEach(el => {
          try {
            const text = (el.textContent || '').trim();
            if (!text) return;
            if (moreRe.test(text) || el.classList.contains('more') || el.classList.contains('collapsed') || el.classList.contains('show-more')) {
              // remove the toggle node entirely so it cannot re-appear
              if (el.parentNode) el.parentNode.removeChild(el);
            }
          } catch (e) { /* ignore */ }
        });
      }

      // Expand all composition children so none are hidden by collapsed UI
      function expandAllComposition() {
        if (!content) return;
        // remove common hiding attributes/classes
        const hiddenSelectors = '[hidden], .hidden, .collapsed, [aria-hidden="true"]';
        content.querySelectorAll(hiddenSelectors).forEach(el => {
          el.removeAttribute('hidden');
          el.classList.remove('hidden', 'collapsed');
          el.setAttribute('aria-hidden', 'false');
          el.style.display = '';
        });
        // ensure list items or rows are visible
        content.querySelectorAll('li, div, p, span').forEach(el => { el.style.display = ''; });
      }

      function setOpen(open) {
        if (open) {
          content.classList.add('open');
          icon.classList.add('open');
          icon.textContent = '−';
          toggle.setAttribute('aria-expanded', 'true');
          content.setAttribute('aria-hidden', 'false');

          // remove any injected toggles and expand everything
          stripControls(content);
          expandAllComposition();
        } else {
          content.classList.remove('open');
          icon.classList.remove('open');
          icon.textContent = '+';
          toggle.setAttribute('aria-expanded', 'false');
          content.setAttribute('aria-hidden', 'true');
        }
      }

      // initialize closed
      setOpen(false);

      toggle.addEventListener('click', () => setOpen(!content.classList.contains('open')));
      toggle.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setOpen(!content.classList.contains('open')); } });

      // Observe composition for changes and strip any injected UI. Also expand when already open.
      const observer = new MutationObserver((mutations) => {
        // If nodes added that look like 'more' toggles, remove them
        let changed = false;
        for (const m of mutations) {
          if (m.addedNodes && m.addedNodes.length) { changed = true; break; }
        }
        if (changed) {
          stripControls(content);
          if (content.classList.contains('open')) expandAllComposition();
        }
      });
      observer.observe(content, { childList: true, subtree: true });

      // run once in case content was already populated
      stripControls(content);

    })();
  </script>


  <div id="axesGizmo"></div>
  <div id="axesLegend">
    <div class="legend-row"><span class="dot dot-a"></span>a</div>
    <div class="legend-row"><span class="dot dot-b"></span>b</div>
    <div class="legend-row"><span class="dot dot-c"></span>c</div>
  </div>
  <div id="viewToolbar">
    <button class="vbtn" id="viewX">X</button>
    <button class="vbtn" id="viewY">Y</button>
    <button class="vbtn" id="viewZ">Z</button>
    <div class="vsep"></div>
    <button class="vbtn" id="viewA">a</button>
    <button class="vbtn" id="viewB">b</button>
    <button class="vbtn" id="viewC">c</button>
    <div class="vsep"></div>
    <button class="vbtn" id="resetView">Reset</button>
  </div>

</body>
</html>
