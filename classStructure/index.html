<!doctype html>
<html>

  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CrysViz Crystal Structure Viewer</title>
    <link rel="stylesheet" href="./styles/styles.css">
    <link rel="stylesheet" href="./styles/styles_file_browswer.css">
    <link rel="stylesheet" href="./styles/trajectoryPanel.css">
    <link rel="stylesheet" href="./styles/controlPanel.css">
    <link rel="stylesheet" href="./styles/backendPanel.css">
    <link rel="stylesheet" href="./styles/toggle_styles.css">
    <link rel="stylesheet" href="./styles/BondAtomColorPanel.css">
    <link rel="stylesheet" href="./styles/info_button_styles.css">


    <script type="importmap">
      {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
    </script>

    <!-- All styles moved to styles.css -->
  </head>

  <body>
    <div id="mobileMenuToggle">☰</div>
    <div id="mobileOverlay"></div>
    <div id="backgroundDot" class="background-dot"></div>
    <div id="ui">
      <img src="./data/CrysViz_logo_clear_back_beta.png" alt="Crystal Structure Viewer" class="logo" id="aboutTrigger" role="button" tabindex="0">
      <div class="backend-control-group">
         <div class="info-button-panel">
            <button class="info-button" id="backendInfoButton">i</button>
         </div>  
        <div class="segmented-backend-control" id="BackendModeSwitch">
          <button data-mode="none"class="active">Viz</button>
          <button data-mode="symmetry">Symmetry</button>
          <button data-mode="ai">AI</button>
          <button data-mode="nep">NEP</button>
        </div>
        <div class="backend-control-group", id="BackendCalcPanel">
            <h1> Choose Symmetry, AI, or NEP mode for more advanced functionalities </h1>
        </div>
      </div>
      <div class="control-group">
         <div class="info-button-panel">
            <button class="info-button" id="uploadInfoButton">i</button>
         </div>
        <div class="input-mode-toggle" role="tablist" aria-label="Structure input mode">
          <button type="button" class="input-mode-btn active" data-mode="file" role="tab" id="fileInputTab" aria-selected="true" aria-controls="fileInputContainer">
            Upload File
          </button>
          <button type="button" class="input-mode-btn" data-mode="text" role="tab" id="textInputTab" aria-selected="false" aria-controls="textInputContainer">
            Paste Text
          </button>
        </div>
        <div id="fileInputContainer" class="input-mode-panel" role="tabpanel" aria-labelledby="fileInputTab">
          <input type="file" id="fileInput" multiple>
          <label for="fileInput" id="fileLabel" tabindex="0">
            📁 Choose Files or Drag & Drop
          </label>
        </div>
        <div id="textInputContainer" class="input-mode-panel" role="tabpanel" hidden aria-labelledby="textInputTab">
          <textarea id="structureText" placeholder="Paste POSCAR/CIF content, OPTIMADE URL, Materials Project mp-id, or Alexandria agm-id"></textarea>
          <button type="button" id="loadTextButton">Load Structure</button>
        </div>
        <div class="panel">
          <table id="objectTable">
            <thead>
              <tr>
                <th class="fth" colspan="1"></th>
                <th class="fth">Filename</th>
                <th class="fth">Traj.</th>
                <th class="fth">Step</th>
                <th class="fth" colspan="2"></th>
              </tr>
            </thead>
            <tbody>
              <!-- JS-generated rows will go here -->
            </tbody>
          </table>

          <div id="errorPanel" class="error-panel">
            Only two structures can be compared
          </div>
        </div>
         <button type="button" id="saveButton">Download POSCAR</button>
      </div>

    <div class="control-group" id="structureControls2" style="display: none;">
         <div class="info-button-panel">
            <button class="info-button" id="analysisInfoButton">i</button>
         </div>
        <div class="segmented-control" id="ControlPanelModeSwitch">
          <button data-mode="none" class="active">None</button>
          <button data-mode="trajectory">Trajectory</button>
          <button data-mode="comparison">Comparison</button>
        </div>

        <div class="segmented-control" id="ControlPanelSpinForceSwitch">
          <button data-mode="none" class="active">None</button>
          <button data-mode="Forces">Forces</button>
          <button data-mode="Spins">Spins</button>
          <button data-mode="Field">Field</button>
         </div>
         <div id="SpinForceFieldContainer"></div>

        <div class="segmented-control" id="ControlPanelAnalysisSwitch">
          <button data-mode="none" class="active">None</button>
          <button data-mode="Bonds">Bonds</button>
          <button data-mode="Lattice">Cell</button>
          <button data-mode="Polyhedra">Polyhedra</button>
        </div>
        <div id="BondLatticeContainer"></div>

    </div>






      <div class="control-group" id="structureControls" style="display: none;">
         <div class="info-button-panel">
            <button class="info-button" id="storageInfoButton">i</button>
         </div> 
         <div class="segmented-control" id="StorageOptionSwitch">
          <button data-mode="Nothing">None</button>
          <button data-mode="Minimal"class="active"> Minimal</button>
          <button data-mode="All Settings">All Settings</button>
        </div>

        <div class="toggle_group">
          <label class="toggle_row toggle_container">
            <span class="toggle_switch">
              <input type="checkbox" id="showAtoms" checked>
              <span class="toggle_slider"></span>
            </span>
            <span class="toggle_text">Show Atoms</span>
          </label>

          <label class="toggle_row toggle_container">
            <span class="toggle_switch">
              <input type="checkbox" id="showBonds" checked>
              <span class="toggle_slider"></span>
            </span>
            <span class="toggle_text">Show Bonds</span>
          </label>

          <label class="toggle_row toggle_container">
            <span class="toggle_switch">
              <input type="checkbox" id="showLattice" checked>
              <span class="toggle_slider"></span>
            </span>
            <span class="toggle_text">Show Unit Cell</span>
          </label>

          <label class="toggle_row toggle_container">
            <span class="toggle_switch">
              <input type="checkbox" id="showPeriodic">
              <span class="toggle_slider"></span>
            </span>
            <span class="toggle_text">Show Periodic Images</span>
          </label>
          <label class="toggle_row toggle_container">
            <span class="toggle_switch">
              <input type="checkbox" id="PBCBondToggle">
              <span class="toggle_slider"></span>
            </span>
            <span class="toggle_text"> Neighbour Bonds</span>
          </label>

          <label class="toggle_row toggle_container">
            <span class="toggle_switch">
              <input type="checkbox" id="showPolyhedra">
              <span class="toggle_slider"></span>
            </span>
            <span class="toggle_text">Show Polyhedra</span>
          </label>
        </div>
       <!-- Color Settings -->
       <div id="colorContainer"></div>
        <!-- Camera Settings -->
       <div id="cameraContainer"></div>


        <label>
          Atom Size: <span id="atomSizeValue" class="slider-value">0.40</span>
          <input type="range" id="atomSize" min="0.30" max="0.80" step="0.1" value="0.40">
        </label>
        <label>
          Bond Width: <span id="bondWidthValue" class="slider-value">0.12</span>
          <input type="range" id="bondWidth" min="0.02" max="0.20" step="0.01" value="0.1">
        </label>
    </div>

     </div>



    <div id="view"></div>

    <div id="aboutOverlay" hidden>
      <div id="aboutModal" role="dialog" aria-modal="true" aria-labelledby="aboutTitle" tabindex="-1">

        <img src="./data/CrysViz_logo_clear_back_newyear.png" alt="Crystal Structure Viewer" class="logo">
        <h1 id="aboutTitle" class="visually-hidden">About Crystal Structure Viewer</h1>
        <button id="aboutClose" aria-label="Close About panel">×</button>
        <div id="aboutContent" aria-live="polite">
          <p id="aboutLoading">Loading About content…</p>
        </div>
      </div>
    </div>

    <!-- Measurement Tools UI -->
    <div id="measurementTools">
      <!-- Measurement panel -->
      <div id="measurementPanel" class="measurement-group">
        <button id="distanceModeBtn" class="measure-tool-btn" title="Distance Measurement">
          <div class="tool-icon scale-icon">📏</div>
          <span>Distance</span>
        </button>
        <button id="angleModeBtn" class="measure-tool-btn" title="Angle Measurement">
          <div class="tool-icon protractor-icon">📐</div>
          <span>Angle</span>
        </button>
        <button id="clearAllMeasurements" class="measure-tool-btn clear-btn" title="Clear All Measurements">
          <div class="tool-icon">🗑️</div>
          <span>Clear</span>
        </button>
        <button id="deleteModeBtn" class="measure-tool-btn" title="Delete Atom">
          <div class="tool-icon">❌</div>
          <span>Delete</span>
        </button>
        <button id="restoreBtn" class="measure-tool-btn clear-btn" title="Delete Atom">
          <div class="tool-icon">↩</div>
          <span>Restore</span>
        </button>
      </div>

      <!-- Mobile toggle button (shows only on mobile) -->
      <button id="measurementToggle" class="measurement-toggle" title="Toggle Measurements">🛠️</button>
    </div>   

<div id="cameraTools">
  <!-- Camera panel -->
  <div id="cameraPanel" class="measurement-group">
    <!-- First row of rotation buttons (X, Y, Z, A, B, C, Reset) -->
    <button class="measure-tool-btn" id="viewX" title="View X axis">
      <div class="tool-icon">x</div>
      <span>x</span>
    </button>
    <button class="measure-tool-btn" id="viewY" title="View Y axis">
      <div class="tool-icon">y</div>
      <span>y</span>
    </button>
    <button class="measure-tool-btn" id="viewZ" title="View Z axis">
      <div class="tool-icon">z</div>
      <span>z</span>
    </button>
    <div class="camera-separator"></div>
    <button class="measure-tool-btn" id="viewA" title="View A axis">
      <div class="tool-icon">a</div>
      <span>a</span>
    </button>
    <button class="measure-tool-btn" id="viewB" title="View B axis">
      <div class="tool-icon">b</div>
      <span>b</span>
    </button>
    <button class="measure-tool-btn" id="viewC" title="View C axis">
      <div class="tool-icon">c</div>
      <span>c</span>
    </button>

    <!-- Reset button -->
    <button class="measure-tool-reset-btn" id="resetView" title="Reset Camera View">
      <div class="reset-icon"></div>
      <span>Reset</span>
    </button>

    <!-- Separator -->
    <div class="camera-separator"></div>
      <!-- Second row of angle adjustment controls (for X, Y, Z) -->
        <div class="measurement-group">
          <!-- X Axis Angle Controls -->
          <div class="rotation-axis">
            <div class="angle-controls">
              <input type="text" id="xAngle" class="angle-input" value="0" readonly />
              <div class="angle-buttons">
                <button class="angle-btn" id="xUp" title="Increase X Axis Angle">↑</button>
                <button class="angle-btn" id="xDown" title="Decrease X Axis Angle">↓</button>
              </div>
            </div>
          </div>

          <!-- Y Axis Angle Controls -->
          <div class="rotation-axis">
            <div class="angle-controls">
              <input type="text" id="yAngle" class="angle-input" value="0" readonly />
              <div class="angle-buttons">
                <button class="angle-btn" id="yUp" title="Increase Y Axis Angle">↑</button>
                <button class="angle-btn" id="yDown" title="Decrease Y Axis Angle">↓</button>
              </div>
            </div>
          </div>

          <!-- Z Axis Angle Controls -->
          <div class="rotation-axis">
            <div class="angle-controls">
              <input type="text" id="zAngle" class="angle-input" value="0" readonly />
              <div class="angle-buttons">
                <button class="angle-btn" id="zUp" title="Increase Z Axis Angle">↑</button>
                <button class="angle-btn" id="zDown" title="Decrease Z Axis Angle">↓</button>
              </div>
            </div>
          </div>
        </div>


    </div>

  <!-- Mobile toggle button (shows only on mobile) -->
  <button id="cameraToggle" class="measurement-toggle" title="Toggle Camera Controls">📷</button>
   </div>
</div>



   <script type="module" src="./crystal-viewer.js"></script> 


    <div id="infoPanel">
      <div id="structureToggle" class="structure-toggle" role="button" tabindex="0" aria-expanded="false" aria-controls="composition">
        <h4>Structure</h4>
        <div id="structureToggleIcon" class="toggle-icon">+</div>
      </div>

      <div id="composition" class="collapsible-content" aria-exanded="false">
        <!-- Composition will be populated by JS. Hidden by default; expands when the header is toggled -->
      </div>
    </div>

    <script>
      (function(){
        const toggle = document.getElementById('structureToggle');
        const icon = document.getElementById('structureToggleIcon');
        const content = document.getElementById('composition');

        function setOpen(open) {
          if (open) {
            content.classList.add('open');
            content.setAttribute('aria-hidden', 'false');
            icon.textContent = '−';
            icon.classList.add('open');
            toggle.setAttribute('aria-expanded', 'true');
          } else {
            content.classList.remove('open');
            content.setAttribute('aria-hidden', 'true');
            icon.textContent = '+';
            icon.classList.remove('open');
            toggle.setAttribute('aria-expanded', 'false');
          }
        }

        // initialize closed
        setOpen(false);

        toggle.addEventListener('click', () => setOpen(!content.classList.contains('open')));
        toggle.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            setOpen(!content.classList.contains('open'));
          }
        });
      })();
    </script>


    <div id="axesGizmo"></div>
    <div id="axesLegend"> 
      <div class="legend-row"><span class="dot dot-a"></span>a</div>
      <div class="legend-row"><span class="dot dot-b"></span>b</div>
      <div class="legend-row"><span class="dot dot-c"></span>c</div>
    </div>

  </body>
</html>
