<!doctype html>
<html>

  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CrysViz Crystal Structure Viewer</title>
    <link rel="stylesheet" href="./styles/styles.css">

    <script type="importmap">
      {

  </head>

  <body>
    <div id="mobileMenuToggle">☰</div>
    <div id="mobileOverlay"></div>
    <div id="backgroundDot" class="background-dot"></div>
    <div id="ui">
      <img src="./data/CrysViz_logo_clear_back_beta.png" alt="Crystal Structure Viewer" class="logo" id="aboutTrigger" role="button" tabindex="0">
      
      <div class="control-group">
        <h3>Load POSCAR/CIF</h3>
        <div class="input-mode-toggle" role="tablist" aria-label="Structure input mode">
          <button type="button" class="input-mode-btn active" data-mode="file" role="tab" id="fileInputTab" aria-selected="true" aria-controls="fileInputContainer">
            Upload File
          </button>
          <button type="button" class="input-mode-btn" data-mode="text" role="tab" id="textInputTab" aria-selected="false" aria-controls="textInputContainer">
            Paste Text
          </button>
        </div>
        <div id="fileInputContainer" class="input-mode-panel" role="tabpanel" aria-labelledby="fileInputTab">
          <input type="file" id="fileInput">
          <label for="fileInput" id="fileLabel" tabindex="0">
            📁 Choose File or Drag & Drop
          </label>
        </div>
        <div id="textInputContainer" class="input-mode-panel" role="tabpanel" hidden aria-labelledby="textInputTab">
          <textarea id="structureText" placeholder="Paste POSCAR/CIF content, OPTIMADE URL, Materials Project mp-id, or Alexandria agm-id"></textarea>
          <button type="button" id="loadTextButton">Load Structure</button>
        </div>
      </div>


      <div class="comparison-group">

            <div id="comparisonToggleIcon" class="toggle-icon">+</div>
          </div> 

        <div id="comparisonContent" class="collapsible-content" aria-hidden="true">
        <div class="second-input-mode-toggle" role="tablist" aria-label="Second structure input mode">
          <button type="button" class="second-input-mode-btn active" data-mode="file" role="tab" id="secondFileInputTab" aria-selected="true" aria-controls="secondFileInputContainer">
            Upload File
          </button>
          <button type="button" class="second-input-mode-btn" data-mode="text" role="tab" id="secondTextInputTab" aria-selected="false" aria-controls="secondTextInputContainer">
            Paste Text
          </button>
        </div>
        <div id="secondFileInputContainer" class="second-input-mode-panel" role="tabpanel" aria-labelledby="secondFileInputTab">
          <input type="file" id="secondFileInput">
          <label for="secondFileInput" id="secondFileLabel" tabindex="0">
            📁 Choose File or Drag & Drop
          </label>
        </div>
        <div id="secondTextInputContainer" class="second-input-mode-panel" role="tabpanel" hidden aria-labelledby="secondTextInputTab">
          <textarea id="secondStructureText" placeholder="Paste POSCAR/CIF content, OPTIMADE URL, Materials Project mp-id, or Alexandria agm-id"></textarea>
          <button type="button" id="secondLoadTextButton">Load Structure</button>
        </div>
        <label>
            <input type="checkbox" id="showSecond" checked> Show Second Structure
          </label>
           <label>
          <input type="checkbox" id="showSecondBonds" checked> Show Bonds
        </label>
        <label>
          <input type="checkbox" id="showSecondLattice" checked> Show Unit Cell
        </label>
        <label>
          <input type="checkbox" id="showComparisonInfo" checked>Show Comparison
        </label>
        <label>
        Structure Overlay: 
              <span id="structure2Opacity" class="slider-value"></span>
               <input type="range" id="structure2OpacityValue" min="0.0" max="1.0" step="0.05" v    alue="0.5">
              <div style="display: flex; justify-content: space-between; font-size: 0.9em; margin-top: 4px;">
                <span>Main</span>
                <span>Second</span>
              </div>
         </label>   
          </div>
      </div>

      <div class="control-group" id="structureControls" style="display: none;">
        <h3>Visualization Options</h3>
        <label>
          <input type="checkbox" id="showBonds" checked> Show Bonds
        </label>
        <label>
          <input type="checkbox" id="showLattice" checked> Show Unit Cell
        </label>
        <label>
          <input type="checkbox" id="neighborBonds"> Show Periodic Images
        </label>
        <label>
          <input type="checkbox" id="showPolyhedra"> Show Polyhedra
        </label>
        <label>
          <input type="checkbox" id="orthographicCamera" checked> Parallel Projection
        </label>
        <label>
          <input type="checkbox" id="defaultColors" checked> Default Colors
        </label>
        <label>
          Atom Size: <span id="atomSizeValue" class="slider-value">0.40</span>

        </label>

        </label>

      <!-- Bond controls group -->

    <!-- Measurement Tools UI -->
    <div id="measurementTools">
      <!-- Measurement panel -->

        <button id="deleteModeBtn" class="measure-tool-btn" title="Delete Atom">

<div id="cameraTools">

    </button>

    </button>
    <div class="camera-separator"></div>
    <button class="measure-tool-btn" id="viewA" title="View A axis">

    </button>
    <button class="measure-tool-btn" id="viewB" title="View B axis">

    </button>
    <button class="measure-tool-btn" id="viewC" title="View C axis">

    </button>

    </button>

    <!-- Separator -->
    <div class="camera-separator"></div>
      <!-- Second row of angle adjustment controls (for X, Y, Z) -->
        <div class="measurement-group">

          <div class="rotation-axis">
            <div class="angle-controls">
              <input type="text" id="xAngle" class="angle-input" value="0" readonly />
              <div class="angle-buttons">
                <button class="angle-btn" id="xUp" title="Increase X Axis Angle">↑</button>
                <button class="angle-btn" id="xDown" title="Decrease X Axis Angle">↓</button>
              </div>
            </div>
          </div>

          <!-- Y Axis Angle Controls -->
          <div class="rotation-axis">
            <div class="angle-controls">
              <input type="text" id="yAngle" class="angle-input" value="0" readonly />
              <div class="angle-buttons">
                <button class="angle-btn" id="yUp" title="Increase Y Axis Angle">↑</button>
                <button class="angle-btn" id="yDown" title="Decrease Y Axis Angle">↓</button>
              </div>
            </div>
          </div>

          <!-- Z Axis Angle Controls -->
          <div class="rotation-axis">
            <div class="angle-controls">
              <input type="text" id="zAngle" class="angle-input" value="0" readonly />
              <div class="angle-buttons">
                <button class="angle-btn" id="zUp" title="Increase Z Axis Angle">↑</button>
                <button class="angle-btn" id="zDown" title="Decrease Z Axis Angle">↓</button>
              </div>
            </div>
          </div>
        </div>


    </div>

  <!-- Mobile toggle button (shows only on mobile) -->
  <button id="cameraToggle" class="measurement-toggle" title="Toggle Camera Controls">📷</button>
   </div>
</div>



   <script type="module" src="./crystal-viewer.js"></script> 


    <div id="infoPanel">
      <div id="structureToggle" class="structure-toggle" role="button" tabindex="0" aria-expanded="false" aria-controls="composition">
        <h4>Structure</h4>
        <div id="structureToggleIcon" class="toggle-icon">+</div>
      </div>

      <div id="composition" class="collapsible-content" aria-exanded="false">
        <!-- Composition will be populated by JS. Hidden by default; expands when the header is toggled -->
      </div>
    </div>

    <script>
      (function(){
        const toggle = document.getElementById('structureToggle');
        const icon = document.getElementById('structureToggleIcon');
        const content = document.getElementById('composition');

        function setOpen(open) {
          if (open) {
            content.classList.add('open');
            content.setAttribute('aria-hidden', 'false');
            icon.textContent = '−';
            icon.classList.add('open');
            toggle.setAttribute('aria-expanded', 'true');
          } else {
            content.classList.remove('open');
            content.setAttribute('aria-hidden', 'true');
            icon.textContent = '+';
            icon.classList.remove('open');
            toggle.setAttribute('aria-expanded', 'false');
          }
        }

        // initialize closed
        setOpen(false);

        toggle.addEventListener('click', () => setOpen(!content.classList.contains('open')));
        toggle.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            setOpen(!content.classList.contains('open'));
          }
        });
      })();
    </script>

    <div id="axesLegend">

      <div class="legend-row"><span class="dot dot-b"></span>b</div>
      <div class="legend-row"><span class="dot dot-c"></span>c</div>
    </div>

        toggle.addEventListener('click', () => setOpen(!content.classList.contains('open')));
        toggle.addEventListener('keydown', e => {
