<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NEP WASM Simple Demo</title>
  <style>
    body { font-family: sans-serif; margin: 20px; max-width: 900px; }
    textarea { width: 100%; height: 220px; font-family: monospace; }
    pre { background: #f5f5f5; padding: 12px; overflow: auto; }
    button, input { margin: 6px 0; }
  </style>
</head>
<body>
  <h2>NEP WASM Simple Demo</h2>

  <div>
    <button id="loadDefaultBtn">Load Default Model</button>
    <input id="modelFile" type="file" accept=".txt" />
    <div id="status">Status: not initialized</div>
  </div>

  <h3>Structure JSON</h3>
  <textarea id="input"></textarea>
  <button id="runBtn">Compute</button>

  <h3>Output JSON</h3>
  <pre id="output"></pre>

  <script src="nep_wasm.js"></script>
  <script src="nep_simple.js"></script>
  <script>
    const runner = new NEPWasmRunner({ defaultModelUrl: 'C_2022_NEP3.txt' });

    function defaultStructure() {
      return {
        lattice: [
          [3.567, 0.0, 0.0],
          [0.0, 3.567, 0.0],
          [0.0, 0.0, 3.567]
        ],
        positions: [
          [0.0, 0.0, 0.0],
          [1.7835, 1.7835, 1.7835]
        ],
        symbols: ['C', 'C']
      };
    }

    function setStatus(msg) {
      document.getElementById('status').textContent = `Status: ${msg}`;
    }

    function setOutput(obj) {
      document.getElementById('output').textContent =
        typeof obj === 'string' ? obj : JSON.stringify(obj, null, 2);
    }

    async function init() {
      await runner.init();
      setStatus('WASM initialized');
    }

    document.getElementById('input').value = JSON.stringify(defaultStructure(), null, 2);

    document.getElementById('loadDefaultBtn').addEventListener('click', async () => {
      try {
        const info = await runner.loadDefaultModel();
        setStatus(`model loaded: ${info.name}` + (info.legacy_cutoff_patched ? ' (legacy cutoff patched)' : ''));
        setOutput(info);
      } catch (err) {
        setOutput(err.message || String(err));
      }
    });

    document.getElementById('modelFile').addEventListener('change', async (e) => {
      try {
        const file = e.target.files[0];
        if (!file) return;
        const info = await runner.loadModelFromFile(file);
        setStatus(`model loaded: ${info.name}` + (info.legacy_cutoff_patched ? ' (legacy cutoff patched)' : ''));
        setOutput(info);
      } catch (err) {
        setOutput(err.message || String(err));
      }
    });

    document.getElementById('runBtn').addEventListener('click', () => {
      try {
        const structure = JSON.parse(document.getElementById('input').value);
        const result = runner.compute(structure);
        setOutput(result);
      } catch (err) {
        setOutput(err.message || String(err));
      }
    });

    init().catch((err) => setOutput(err.message || String(err)));
  </script>
</body>
</html>
