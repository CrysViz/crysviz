# Lint + typecheck + import checks for CrysViz.
# Runs `make check` (lint, tsc --checkJs, and the static import resolver).
name: Checks

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs for the same branch/PR.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dev tooling
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package test/build tooling
        run: python -m pip install build

      - name: Install package editable for Python tests
        run: python -m pip install -e .

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Seed ignored generated frontend files
        run: |
          mkdir -p docs/compiled/periodic_wasm_src/target docs/compiled/periodic_wasm_src/pkg docs/report
          touch docs/compiled/periodic_wasm_src/target/must-not-package.txt
          touch docs/compiled/periodic_wasm_src/pkg/must-not-package.txt
          touch docs/report/must-not-package.txt

      - name: Build wheel and source distribution
        run: python -m build

      - name: Inspect distribution contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from pathlib import PurePosixPath
          import tarfile
          import zipfile

          artifacts = list(Path("dist").glob("*.whl")) + list(Path("dist").glob("*.tar.gz"))
          assert len(artifacts) == 2, artifacts
          for artifact in artifacts:
              names = (zipfile.ZipFile(artifact).namelist()
                       if artifact.name.endswith(".whl")
                       else tarfile.open(artifact).getnames())
              assert any(name.endswith(("crysviz/web/compiled/periodic_wasm_bg.wasm", "docs/compiled/periodic_wasm_bg.wasm")) for name in names)
              assert any(name.endswith(("crysviz/web/data/CrysViz_logo_clear_back.png", "docs/data/CrysViz_logo_clear_back.png")) for name in names)
              assert any("LICENSE" in name for name in names)
              assert any("NOTICE" in name for name in names)
              assert not any(
                  {"target", "pkg", "report"} & set(PurePosixPath(name).parts)
                  for name in names
              )
              assert not any(
                  "tools/browsertest/env" in name or "tests" in PurePosixPath(name).parts
                  for name in names
              )
          PY

      - name: Install wheel and verify from unrelated directory
        run: |
          python -m venv /tmp/crysviz-wheel-venv
          /tmp/crysviz-wheel-venv/bin/python -m pip install dist/*.whl
          (cd /tmp && /tmp/crysviz-wheel-venv/bin/python -c 'import importlib.resources, crysviz; assert crysviz.__version__ == "0.1.0"; assert importlib.resources.files("crysviz.web").joinpath("index.html").is_file()')
          (cd /tmp && /tmp/crysviz-wheel-venv/bin/crysviz --help >/dev/null && /tmp/crysviz-wheel-venv/bin/crysviz --version)

      - name: Install sdist and verify from unrelated directory
        run: |
          python -m venv /tmp/crysviz-sdist-venv
          /tmp/crysviz-sdist-venv/bin/python -m pip install dist/*.tar.gz
          (cd /tmp && /tmp/crysviz-sdist-venv/bin/python -c 'import importlib.resources, crysviz; assert importlib.resources.files("crysviz.web").joinpath("compiled/periodic_wasm_bg.wasm").is_file()')
          (cd /tmp && /tmp/crysviz-sdist-venv/bin/crysviz --version)

      - name: Run checks (lint + typecheck + imports)
        run: make check

  browser-package:
    name: Package browser smoke
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install browser test tooling
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and install wheel
        run: |
          python -m pip install build
          python -m build --wheel
          python -m venv /tmp/crysviz-browser-venv
          /tmp/crysviz-browser-venv/bin/python -m pip install dist/*.whl

      - name: Set up Firefox/Xvfb browser environment
        run: make browsertest-setup

      - name: Run focused host and packaged CLI browser tests
        run: tools/browsertest/run.sh tests/hostfacade.test.js tests/packagecli.test.js
        env:
          CRYSVIZ_COMMAND: /tmp/crysviz-browser-venv/bin/crysviz
