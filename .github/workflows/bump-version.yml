# Start a release from the Actions tab: pick major / minor / fix and this opens
# a "Bump version" PR (tools/release/bump_version.py rewrites every place the
# version appears). Nothing is published until main reaches the deploy branch
# (.github/workflows/release.yml).
#
# Requires Settings > Actions > General > "Allow GitHub Actions to create and
# approve pull requests". A PR opened with GITHUB_TOKEN does not trigger
# pull_request workflows, so the Checks workflow is dispatched on the branch
# explicitly; its result shows on the PR's head commit.
name: Bump version

on:
  workflow_dispatch:
    inputs:
      part:
        description: Which semver part to bump
        type: choice
        options: [fix, minor, major]
        default: fix
      version:
        description: Explicit version instead (e.g. 0.10.0); overrides the choice above
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump
        id: bump
        env:
          PART: ${{ github.event.inputs.part }}
          EXPLICIT: ${{ github.event.inputs.version }}
        run: |
          old=$(python3 tools/release/bump_version.py --print)
          python3 tools/release/bump_version.py "${EXPLICIT:-$PART}"
          new=$(python3 tools/release/bump_version.py --print)
          echo "old=$old" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"

      - name: Open the PR
        env:
          GH_TOKEN: ${{ github.token }}
          OLD: ${{ steps.bump.outputs.old }}
          NEW: ${{ steps.bump.outputs.new }}
          PART: ${{ github.event.inputs.part }}
          EXPLICIT: ${{ github.event.inputs.version }}
        run: |
          branch="release/v$NEW"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "Bump version to $NEW"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Bump version to $NEW" \
            --body "$(printf 'Version %s -> %s (%s).\n\n**Before merging:** check the release notes under the new heading in CHANGELOG.md (the Unreleased notes were moved there); edit them on this branch. A release with an empty section is refused.\n\nAfter merging, pushing main to `deploy` publishes **v%s** to PyPI and creates the GitHub Release (.github/workflows/release.yml).' "$OLD" "$NEW" "${EXPLICIT:-$PART}" "$NEW")"
          gh workflow run check.yml --ref "$branch"
